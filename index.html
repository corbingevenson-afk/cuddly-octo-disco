<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Hub - Game Launcher</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #12122a;
            --bg-card: #1a1a3e;
            --bg-card-hover: #242458;
            --accent-primary: #6c5ce7;
            --accent-secondary: #a29bfe;
            --accent-glow: rgba(108, 92, 231, 0.4);
            --text-primary: #ffffff;
            --text-secondary: #a0a0c0;
            --text-muted: #6060a0;
            --border: rgba(108, 92, 231, 0.2);
            --success: #00b894;
            --warning: #fdcb6e;
            --danger: #e17055;
            --info: #74b9ff;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(108, 92, 231, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(162, 155, 254, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(116, 185, 255, 0.04) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        /* Header */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 26, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0 40px;
        }

        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .logo-text {
            font-size: 1.5em;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-secondary), #74b9ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .search-bar {
            position: relative;
            width: 350px;
        }

        .search-bar input {
            width: 100%;
            padding: 10px 16px 10px 42px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 0.95em;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.3s;
        }

        .search-bar input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.15);
        }

        .search-bar input::placeholder { color: var(--text-muted); }

        .search-bar .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
        }

        .header-stats {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 1.2em;
            font-weight: 700;
            color: var(--accent-secondary);
        }

        .stat-label {
            font-size: 0.7em;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Main content */
        .main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 40px 60px;
            position: relative;
            z-index: 1;
        }

        /* Category filters */
        .categories {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .category-btn {
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            font-family: 'Inter', sans-serif;
            font-size: 0.85em;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .category-btn:hover {
            border-color: var(--accent-primary);
            color: var(--accent-secondary);
        }

        .category-btn.active {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            color: white;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        /* Section headers */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            margin-top: 10px;
        }

        .section-title {
            font-size: 1.4em;
            font-weight: 700;
        }

        .section-count {
            color: var(--text-muted);
            font-size: 0.9em;
        }

        /* Featured game */
        .featured {
            background: linear-gradient(135deg, var(--bg-card), rgba(108, 92, 231, 0.15));
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 40px;
            cursor: pointer;
            transition: all 0.4s;
            position: relative;
            overflow: hidden;
        }

        .featured::before {
            content: '';
            position: absolute;
            top: -50%; right: -20%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(108, 92, 231, 0.1), transparent 70%);
            pointer-events: none;
        }

        .featured:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 60px rgba(108, 92, 231, 0.15);
            border-color: var(--accent-primary);
        }

        .featured-preview {
            width: 200px;
            height: 200px;
            border-radius: 16px;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            flex-shrink: 0;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .featured-info { position: relative; z-index: 1; }

        .featured-badge {
            display: inline-block;
            padding: 4px 12px;
            background: var(--accent-primary);
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: 600;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .featured-title {
            font-size: 2em;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .featured-desc {
            color: var(--text-secondary);
            font-size: 1em;
            line-height: 1.6;
            margin-bottom: 20px;
            max-width: 500px;
        }

        .play-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 32px;
            background: linear-gradient(135deg, var(--accent-primary), #5a4bd1);
            border: none;
            border-radius: 12px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .play-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px var(--accent-glow);
        }

        /* Game grid */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .game-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .game-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            border-color: var(--accent-primary);
        }

        .game-card:hover .card-preview {
            transform: scale(1.05);
        }

        .card-preview-wrapper {
            overflow: hidden;
            height: 180px;
            position: relative;
        }

        .card-preview {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            transition: transform 0.4s;
        }

        .card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, var(--bg-card), transparent 50%);
            pointer-events: none;
        }

        .card-difficulty {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.7em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .difficulty-easy { background: rgba(0, 184, 148, 0.2); color: var(--success); }
        .difficulty-medium { background: rgba(253, 203, 110, 0.2); color: var(--warning); }
        .difficulty-hard { background: rgba(225, 112, 85, 0.2); color: var(--danger); }

        .card-info {
            padding: 16px 20px 20px;
        }

        .card-title {
            font-size: 1.15em;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .card-desc {
            color: var(--text-secondary);
            font-size: 0.85em;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-tags {
            display: flex;
            gap: 6px;
        }

        .card-tag {
            padding: 3px 8px;
            background: rgba(108, 92, 231, 0.1);
            border-radius: 6px;
            font-size: 0.7em;
            color: var(--accent-secondary);
            font-weight: 500;
        }

        .card-play {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--accent-primary);
            border: none;
            color: white;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .card-play:hover {
            transform: scale(1.1);
        }

        /* Color themes for game cards */
        .theme-green .card-preview { background: linear-gradient(135deg, #00b894, #00cec9); }
        .theme-blue .card-preview { background: linear-gradient(135deg, #0984e3, #74b9ff); }
        .theme-purple .card-preview { background: linear-gradient(135deg, #6c5ce7, #a29bfe); }
        .theme-red .card-preview { background: linear-gradient(135deg, #e17055, #fab1a0); }
        .theme-orange .card-preview { background: linear-gradient(135deg, #e17055, #fdcb6e); }
        .theme-pink .card-preview { background: linear-gradient(135deg, #e84393, #fd79a8); }
        .theme-teal .card-preview { background: linear-gradient(135deg, #00cec9, #81ecec); }
        .theme-yellow .card-preview { background: linear-gradient(135deg, #fdcb6e, #ffeaa7); }
        .theme-indigo .card-preview { background: linear-gradient(135deg, #2d3436, #636e72); }

        /* Responsive */
        @media (max-width: 768px) {
            .header { padding: 0 20px; }
            .main { padding: 20px; }
            .search-bar { width: 200px; }
            .featured { flex-direction: column; padding: 24px; gap: 20px; text-align: center; }
            .featured-preview { width: 120px; height: 120px; font-size: 50px; }
            .featured-title { font-size: 1.4em; }
            .header-stats { display: none; }
            .game-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
        }

        @media (max-width: 480px) {
            .search-bar { display: none; }
            .game-grid { grid-template-columns: 1fr; }
        }

        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .game-card { animation: fadeInUp 0.5s ease forwards; opacity: 0; }

        .game-card:nth-child(1) { animation-delay: 0.05s; }
        .game-card:nth-child(2) { animation-delay: 0.1s; }
        .game-card:nth-child(3) { animation-delay: 0.15s; }
        .game-card:nth-child(4) { animation-delay: 0.2s; }
        .game-card:nth-child(5) { animation-delay: 0.25s; }
        .game-card:nth-child(6) { animation-delay: 0.3s; }
        .game-card:nth-child(7) { animation-delay: 0.35s; }
        .game-card:nth-child(8) { animation-delay: 0.4s; }
        .game-card:nth-child(9) { animation-delay: 0.45s; }

        /* Back to top */
        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--accent-primary);
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 20px var(--accent-glow);
            transition: all 0.3s;
            opacity: 0;
            pointer-events: none;
            z-index: 99;
        }

        .back-to-top.visible {
            opacity: 1;
            pointer-events: all;
        }

        .back-to-top:hover {
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div class="logo">
                <div class="logo-icon">&#127918;</div>
                <span class="logo-text">Arcade Hub</span>
            </div>
            <div class="search-bar">
                <span class="search-icon">&#128269;</span>
                <input type="text" id="searchInput" placeholder="Search games..." autocomplete="off">
            </div>
            <div class="header-stats">
                <div class="stat">
                    <div class="stat-value" id="totalGames">0</div>
                    <div class="stat-label">Games</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="totalCategories">0</div>
                    <div class="stat-label">Categories</div>
                </div>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="categories" id="categories"></div>

        <div id="featuredSection"></div>

        <div class="section-header">
            <h2 class="section-title" id="sectionTitle">All Games</h2>
            <span class="section-count" id="sectionCount"></span>
        </div>

        <div class="game-grid" id="gameGrid"></div>
    </main>

    <button class="back-to-top" id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">&#8593;</button>

    <script>
        const GAMES = [
            {
                id: 'snake',
                title: 'Snake',
                description: 'Classic snake game. Eat food, grow longer, avoid walls and yourself!',
                icon: '&#128013;',
                category: 'Classic',
                difficulty: 'easy',
                tags: ['Arcade', 'Classic'],
                theme: 'theme-green',
                file: 'games/snake.html',
                featured: true,
                featuredDesc: 'The timeless classic reimagined with smooth controls, progressive difficulty, and a sleek modern look. How long can you survive?'
            },
            {
                id: 'tetris',
                title: 'Tetris',
                description: 'Arrange falling blocks to complete lines. Speed increases as you level up!',
                icon: '&#129513;',
                category: 'Puzzle',
                difficulty: 'medium',
                tags: ['Puzzle', 'Classic'],
                theme: 'theme-blue',
                file: 'games/tetris.html'
            },
            {
                id: 'pong',
                title: 'Pong',
                description: 'The original arcade game. Play against AI in this fast-paced paddle battle.',
                icon: '&#127955;',
                category: 'Classic',
                difficulty: 'easy',
                tags: ['Arcade', '2-Player'],
                theme: 'theme-purple',
                file: 'games/pong.html'
            },
            {
                id: 'breakout',
                title: 'Breakout',
                description: 'Smash all the bricks with your ball and paddle. Powerups included!',
                icon: '&#129521;',
                category: 'Arcade',
                difficulty: 'medium',
                tags: ['Arcade', 'Action'],
                theme: 'theme-red',
                file: 'games/breakout.html'
            },
            {
                id: 'minesweeper',
                title: 'Minesweeper',
                description: 'Uncover squares without hitting mines. Use logic to flag dangerous cells.',
                icon: '&#128163;',
                category: 'Puzzle',
                difficulty: 'hard',
                tags: ['Puzzle', 'Logic'],
                theme: 'theme-indigo',
                file: 'games/minesweeper.html'
            },
            {
                id: '2048',
                title: '2048',
                description: 'Slide numbered tiles to combine them and reach the 2048 tile!',
                icon: '&#128290;',
                category: 'Puzzle',
                difficulty: 'medium',
                tags: ['Puzzle', 'Math'],
                theme: 'theme-orange',
                file: 'games/2048.html'
            },
            {
                id: 'flappy',
                title: 'Flappy Bird',
                description: 'Tap to fly through the pipes. One hit and it\'s game over!',
                icon: '&#128038;',
                category: 'Arcade',
                difficulty: 'hard',
                tags: ['Arcade', 'Endless'],
                theme: 'theme-teal',
                file: 'games/flappy.html'
            },
            {
                id: 'space-invaders',
                title: 'Space Invaders',
                description: 'Defend Earth from waves of alien invaders. Shoot them before they reach you!',
                icon: '&#128126;',
                category: 'Shooter',
                difficulty: 'medium',
                tags: ['Shooter', 'Classic'],
                theme: 'theme-pink',
                file: 'games/space-invaders.html'
            },
            {
                id: 'memory',
                title: 'Memory Match',
                description: 'Flip cards and find matching pairs. Test your memory and concentration!',
                icon: '&#129504;',
                category: 'Puzzle',
                difficulty: 'easy',
                tags: ['Puzzle', 'Memory'],
                theme: 'theme-yellow',
                file: 'games/memory.html'
            }
        ];

        // Get unique categories
        const categories = ['All', ...new Set(GAMES.map(g => g.category))];
        let activeCategory = 'All';
        let searchQuery = '';

        // Render categories
        function renderCategories() {
            const container = document.getElementById('categories');
            container.innerHTML = categories.map(cat =>
                `<button class="category-btn ${cat === activeCategory ? 'active' : ''}" onclick="filterCategory('${cat}')">${cat}</button>`
            ).join('');
        }

        // Filter by category
        function filterCategory(cat) {
            activeCategory = cat;
            renderCategories();
            renderGames();
        }

        // Get filtered games
        function getFilteredGames() {
            return GAMES.filter(g => {
                const matchCategory = activeCategory === 'All' || g.category === activeCategory;
                const matchSearch = !searchQuery ||
                    g.title.toLowerCase().includes(searchQuery) ||
                    g.description.toLowerCase().includes(searchQuery) ||
                    g.tags.some(t => t.toLowerCase().includes(searchQuery));
                return matchCategory && matchSearch;
            });
        }

        // Render featured game
        function renderFeatured() {
            const featured = GAMES.find(g => g.featured);
            if (!featured) return;

            document.getElementById('featuredSection').innerHTML = `
                <div class="featured" onclick="launchGame('${featured.file}')">
                    <div class="featured-preview">${featured.icon}</div>
                    <div class="featured-info">
                        <span class="featured-badge">&#11088; Featured</span>
                        <h2 class="featured-title">${featured.title}</h2>
                        <p class="featured-desc">${featured.featuredDesc}</p>
                        <button class="play-btn">&#9654; Play Now</button>
                    </div>
                </div>
            `;
        }

        // Render game cards
        function renderGames() {
            const filtered = getFilteredGames();
            const grid = document.getElementById('gameGrid');

            document.getElementById('sectionTitle').textContent =
                activeCategory === 'All' ? 'All Games' : activeCategory + ' Games';
            document.getElementById('sectionCount').textContent =
                filtered.length + ' game' + (filtered.length !== 1 ? 's' : '');

            grid.innerHTML = filtered.map(game => `
                <div class="game-card ${game.theme}" onclick="launchGame('${game.file}')">
                    <div class="card-preview-wrapper">
                        <div class="card-preview">${game.icon}</div>
                        <div class="card-overlay"></div>
                        <span class="card-difficulty difficulty-${game.difficulty}">${game.difficulty}</span>
                    </div>
                    <div class="card-info">
                        <h3 class="card-title">${game.title}</h3>
                        <p class="card-desc">${game.description}</p>
                        <div class="card-meta">
                            <div class="card-tags">
                                ${game.tags.map(t => `<span class="card-tag">${t}</span>`).join('')}
                            </div>
                            <button class="card-play" onclick="event.stopPropagation(); launchGame('${game.file}')">&#9654;</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Launch game
        function launchGame(file) {
            window.location.href = file;
        }

        // Search
        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase().trim();
            renderGames();
        });

        // Back to top
        window.addEventListener('scroll', () => {
            document.getElementById('backToTop').classList.toggle('visible', window.scrollY > 300);
        });

        // Stats
        document.getElementById('totalGames').textContent = GAMES.length;
        document.getElementById('totalCategories').textContent = categories.length - 1;

        // Initialize
        renderCategories();
        renderFeatured();
        renderGames();
    </script>
</body>
</html>
