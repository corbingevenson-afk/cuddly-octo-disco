<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0a0a1a;
  color: #e0e0ff;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
}

a { color: #6c5ce7; text-decoration: none; }
a:hover { text-decoration: underline; }

.top-bar {
  width: 100%;
  padding: 12px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(42, 42, 94, 0.4);
  border-bottom: 1px solid rgba(108, 92, 231, 0.3);
}

.top-bar .back { font-size: 14px; }
.top-bar .title { font-size: 20px; font-weight: 700; letter-spacing: 1px; }

.controls {
  display: flex;
  gap: 12px;
  align-items: center;
  justify-content: center;
  margin: 18px 0 10px;
  flex-wrap: wrap;
}

.controls button {
  background: #2a2a5e;
  color: #e0e0ff;
  border: 2px solid #6c5ce7;
  padding: 8px 20px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
}

.controls button:hover, .controls button.active {
  background: #6c5ce7;
  color: #fff;
}

.stats {
  display: flex;
  gap: 28px;
  justify-content: center;
  margin: 8px 0 14px;
  flex-wrap: wrap;
  font-size: 15px;
}

.stats .stat { display: flex; align-items: center; gap: 6px; }
.stats .label { color: #8888bb; }
.stats .value { font-weight: 700; color: #fff; min-width: 28px; }

.combo-display {
  text-align: center;
  height: 28px;
  font-size: 16px;
  font-weight: 700;
  color: #f9ca24;
  transition: opacity 0.3s;
}

.star-rating { font-size: 22px; letter-spacing: 2px; }
.star-rating .star-on { color: #f9ca24; }
.star-rating .star-off { color: #333355; }

.best-score {
  text-align: center;
  font-size: 13px;
  color: #8888bb;
  margin-bottom: 6px;
  min-height: 18px;
}

.grid-container {
  display: flex;
  justify-content: center;
  padding: 10px;
  width: 100%;
  max-width: 720px;
}

.grid {
  display: grid;
  gap: 10px;
  perspective: 1000px;
}

.grid.easy { grid-template-columns: repeat(4, 1fr); max-width: 420px; }
.grid.medium { grid-template-columns: repeat(4, 1fr); max-width: 440px; }
.grid.hard { grid-template-columns: repeat(6, 1fr); max-width: 600px; }

.card {
  aspect-ratio: 1;
  cursor: pointer;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

.card.flipped { transform: rotateY(180deg); }

.card.matched {
  transform: rotateY(180deg);
  animation: matchPulse 0.5s ease;
}

.card.matched .card-front {
  box-shadow: 0 0 18px 4px rgba(108, 92, 231, 0.6), 0 0 40px 8px rgba(108, 92, 231, 0.2);
  border-color: #6c5ce7;
}

@keyframes matchPulse {
  0% { transform: rotateY(180deg) scale(1); }
  50% { transform: rotateY(180deg) scale(1.1); }
  100% { transform: rotateY(180deg) scale(1); }
}

.card-face {
  position: absolute;
  inset: 0;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border: 2px solid rgba(108, 92, 231, 0.3);
  transition: box-shadow 0.3s, border-color 0.3s;
}

.card-back {
  background: #2a2a5e;
  z-index: 2;
  font-size: 28px;
  color: #6c5ce7;
}

.card-back::after {
  content: '?';
  font-weight: 700;
  font-size: 32px;
  opacity: 0.5;
}

.card-front {
  background: #1a1a3e;
  transform: rotateY(180deg);
  font-size: 42px;
}

.grid.hard .card-front { font-size: 32px; }

/* Win overlay */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(10, 10, 26, 0.92);
  z-index: 100;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
}

.overlay.show { display: flex; }

.overlay h2 {
  font-size: 36px;
  color: #6c5ce7;
  animation: bounceIn 0.6s ease;
}

.overlay .win-stats {
  font-size: 18px;
  text-align: center;
  line-height: 2;
}

.overlay .star-rating { font-size: 36px; margin: 8px 0; }

.overlay button {
  background: #6c5ce7;
  color: #fff;
  border: none;
  padding: 12px 32px;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 10px;
  transition: background 0.2s;
}

.overlay button:hover { background: #7d6ff0; }

@keyframes bounceIn {
  0% { transform: scale(0.3); opacity: 0; }
  50% { transform: scale(1.05); }
  70% { transform: scale(0.95); }
  100% { transform: scale(1); opacity: 1; }
}

/* Confetti */
.confetti-piece {
  position: fixed;
  width: 10px;
  height: 10px;
  z-index: 101;
  border-radius: 2px;
  pointer-events: none;
  animation: confettiFall linear forwards;
}

@keyframes confettiFall {
  0% { opacity: 1; transform: translateY(0) rotate(0deg); }
  100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
}

/* New best badge */
.new-best {
  color: #f9ca24;
  font-weight: 700;
  font-size: 14px;
  animation: bounceIn 0.4s ease;
}
</style>
</head>
<body>

<div class="top-bar">
  <a href="../index.html" class="back">&#8592; Back to Launcher</a>
  <div class="title">Memory Match</div>
  <div style="width:120px"></div>
</div>

<div class="controls">
  <button data-mode="easy" class="active">Easy (4x3)</button>
  <button data-mode="medium">Medium (4x4)</button>
  <button data-mode="hard">Hard (6x6)</button>
  <button id="restart-btn">Restart</button>
</div>

<div class="stats">
  <div class="stat"><span class="label">Moves:</span><span class="value" id="moves">0</span></div>
  <div class="stat"><span class="label">Pairs:</span><span class="value" id="pairs">0 / 0</span></div>
  <div class="stat"><span class="label">Time:</span><span class="value" id="timer">0:00</span></div>
  <div class="stat star-rating" id="stars"></div>
</div>

<div class="combo-display" id="combo"></div>
<div class="best-score" id="best-score"></div>

<div class="grid-container">
  <div class="grid" id="grid"></div>
</div>

<div class="overlay" id="overlay">
  <h2 id="win-title">You Win!</h2>
  <div class="star-rating" id="win-stars"></div>
  <div class="win-stats" id="win-stats"></div>
  <button id="play-again-btn">Play Again</button>
</div>

<script>
const EMOJI_POOL = [
  '🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐸',
  '🐵','🐔','🐧','🐦','🦄','🐝','🐙','🦋','🐢','🐍','🦀','🐳',
  '🍎','🍕','🍔','🍟','🌮','🍩','🍪','🧁','🍉','🍇','🍓','🍌',
  '⚽','🏀','🎾','🏐','🎱','🏓','🎯','🏆','🎸','🎹','🎺','🥁',
  '🚀','✈️','🚂','🚗','⛵','🎭','💎','🔮','🌈','🌟','🎪','🎠'
];

const MODES = {
  easy:   { cols: 4, rows: 3, pairs: 6 },
  medium: { cols: 4, rows: 4, pairs: 8 },
  hard:   { cols: 6, rows: 6, pairs: 18 }
};

const STAR_THRESHOLDS = {
  easy:   [8, 12, 18],
  medium: [12, 18, 26],
  hard:   [24, 36, 54]
};

let state = {
  mode: 'easy',
  cards: [],
  flipped: [],
  matched: 0,
  totalPairs: 0,
  moves: 0,
  combo: 0,
  maxCombo: 0,
  timerStart: null,
  timerInterval: null,
  elapsed: 0,
  locked: false,
  gameOver: false
};

const grid = document.getElementById('grid');
const movesEl = document.getElementById('moves');
const pairsEl = document.getElementById('pairs');
const timerEl = document.getElementById('timer');
const starsEl = document.getElementById('stars');
const comboEl = document.getElementById('combo');
const bestEl = document.getElementById('best-score');
const overlay = document.getElementById('overlay');
const winStars = document.getElementById('win-stars');
const winStats = document.getElementById('win-stats');

document.querySelectorAll('.controls button[data-mode]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.controls button[data-mode]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.mode = btn.dataset.mode;
    startGame();
  });
});

document.getElementById('restart-btn').addEventListener('click', startGame);
document.getElementById('play-again-btn').addEventListener('click', () => {
  overlay.classList.remove('show');
  startGame();
});

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function getStars(mode, moves) {
  const t = STAR_THRESHOLDS[mode];
  if (moves <= t[0]) return 3;
  if (moves <= t[1]) return 2;
  if (moves <= t[2]) return 1;
  return 0;
}

function renderStars(container, count) {
  container.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const s = document.createElement('span');
    s.className = i < count ? 'star-on' : 'star-off';
    s.textContent = '\u2605';
    container.appendChild(s);
  }
}

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return m + ':' + String(s).padStart(2, '0');
}

function loadBest(mode) {
  try {
    return JSON.parse(localStorage.getItem('memory_best_' + mode));
  } catch { return null; }
}

function saveBest(mode, moves, time, stars) {
  const prev = loadBest(mode);
  if (!prev || stars > prev.stars || (stars === prev.stars && moves < prev.moves)) {
    localStorage.setItem('memory_best_' + mode, JSON.stringify({ moves, time, stars }));
    return true;
  }
  return false;
}

function showBest() {
  const b = loadBest(state.mode);
  if (b) {
    bestEl.textContent = 'Best: ' + b.moves + ' moves, ' + formatTime(b.time) + ' (' + '\u2605'.repeat(b.stars) + ')';
  } else {
    bestEl.textContent = '';
  }
}

function startTimer() {
  if (state.timerInterval) clearInterval(state.timerInterval);
  state.timerStart = Date.now();
  state.timerInterval = setInterval(() => {
    state.elapsed = Math.floor((Date.now() - state.timerStart) / 1000);
    timerEl.textContent = formatTime(state.elapsed);
  }, 250);
}

function stopTimer() {
  if (state.timerInterval) { clearInterval(state.timerInterval); state.timerInterval = null; }
}

function startGame() {
  stopTimer();
  overlay.classList.remove('show');
  document.querySelectorAll('.confetti-piece').forEach(c => c.remove());

  const cfg = MODES[state.mode];
  state.cards = [];
  state.flipped = [];
  state.matched = 0;
  state.totalPairs = cfg.pairs;
  state.moves = 0;
  state.combo = 0;
  state.maxCombo = 0;
  state.elapsed = 0;
  state.locked = true;
  state.gameOver = false;

  movesEl.textContent = '0';
  pairsEl.textContent = '0 / ' + cfg.pairs;
  timerEl.textContent = '0:00';
  comboEl.textContent = '';
  renderStars(starsEl, 3);
  showBest();

  const emojis = shuffle([...EMOJI_POOL]).slice(0, cfg.pairs);
  const deck = shuffle([...emojis, ...emojis]);

  grid.className = 'grid ' + state.mode;
  grid.innerHTML = '';

  deck.forEach((emoji, i) => {
    const card = document.createElement('div');
    card.className = 'card flipped';
    card.dataset.index = i;
    card.dataset.emoji = emoji;

    const back = document.createElement('div');
    back.className = 'card-face card-back';

    const front = document.createElement('div');
    front.className = 'card-face card-front';
    front.textContent = emoji;

    card.appendChild(back);
    card.appendChild(front);
    card.addEventListener('click', () => onCardClick(i));
    grid.appendChild(card);
    state.cards.push(card);
  });

  // Brief preview
  setTimeout(() => {
    state.cards.forEach(c => c.classList.remove('flipped'));
    state.locked = false;
  }, 1500);
}

function onCardClick(index) {
  if (state.locked || state.gameOver) return;
  const card = state.cards[index];
  if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

  // Start timer on first move
  if (state.moves === 0 && state.flipped.length === 0 && !state.timerStart) {
    startTimer();
  }

  card.classList.add('flipped');
  state.flipped.push(index);

  if (state.flipped.length === 2) {
    state.moves++;
    movesEl.textContent = state.moves;
    renderStars(starsEl, getStars(state.mode, state.moves));

    const [a, b] = state.flipped;
    const emojiA = state.cards[a].dataset.emoji;
    const emojiB = state.cards[b].dataset.emoji;

    if (emojiA === emojiB) {
      // Match
      state.combo++;
      if (state.combo > state.maxCombo) state.maxCombo = state.combo;
      state.matched++;
      pairsEl.textContent = state.matched + ' / ' + state.totalPairs;

      state.cards[a].classList.add('matched');
      state.cards[b].classList.add('matched');

      if (state.combo > 1) {
        comboEl.textContent = '\uD83D\uDD25 ' + state.combo + 'x Combo!';
        comboEl.style.opacity = '1';
      } else {
        comboEl.textContent = 'Match!';
        comboEl.style.opacity = '1';
      }
      setTimeout(() => { comboEl.style.opacity = '0'; }, 1200);

      state.flipped = [];

      if (state.matched === state.totalPairs) {
        state.gameOver = true;
        stopTimer();
        setTimeout(showWin, 500);
      }
    } else {
      // Mismatch
      state.combo = 0;
      comboEl.textContent = '';
      state.locked = true;
      setTimeout(() => {
        state.cards[a].classList.remove('flipped');
        state.cards[b].classList.remove('flipped');
        state.flipped = [];
        state.locked = false;
      }, 800);
    }
  }
}

function showWin() {
  const stars = getStars(state.mode, state.moves);
  const isNew = saveBest(state.mode, state.moves, state.elapsed, stars);
  showBest();

  renderStars(winStars, stars);

  let html = 'Moves: <strong>' + state.moves + '</strong><br>';
  html += 'Time: <strong>' + formatTime(state.elapsed) + '</strong><br>';
  if (state.maxCombo > 1) html += 'Best Combo: <strong>' + state.maxCombo + 'x</strong><br>';
  if (isNew) html += '<span class="new-best">\u2728 New Best Score! \u2728</span>';

  winStats.innerHTML = html;
  overlay.classList.add('show');
  launchConfetti();
}

function launchConfetti() {
  const colors = ['#6c5ce7','#f9ca24','#e056fd','#7ed6df','#ff6b6b','#badc58','#ffffff'];
  for (let i = 0; i < 120; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.top = -10 - Math.random() * 20 + 'px';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.width = (6 + Math.random() * 8) + 'px';
    el.style.height = (6 + Math.random() * 8) + 'px';
    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    const dur = 2 + Math.random() * 3;
    el.style.animationDuration = dur + 's';
    el.style.animationDelay = Math.random() * 1.5 + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), (dur + 2) * 1000);
  }
}

startGame();
</script>
</body>
</html>
