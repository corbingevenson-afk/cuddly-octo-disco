<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>2048</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a1a;
  color: #e0e0e0;
  font-family: 'Segoe UI', Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  overflow: hidden;
  touch-action: none;
}
a { color: #6c5ce7; text-decoration: none; }
a:hover { text-decoration: underline; }
.back-link {
  position: absolute;
  top: 12px;
  left: 16px;
  font-size: 14px;
}
.header {
  margin-top: 50px;
  text-align: center;
}
.header h1 {
  font-size: 48px;
  font-weight: 800;
  color: #6c5ce7;
  letter-spacing: 2px;
}
.score-bar {
  display: flex;
  gap: 16px;
  margin: 14px 0;
  justify-content: center;
}
.score-box {
  background: #1a1a3e;
  border-radius: 8px;
  padding: 8px 20px;
  text-align: center;
  min-width: 100px;
}
.score-box .label {
  font-size: 11px;
  text-transform: uppercase;
  color: #888;
  letter-spacing: 1px;
}
.score-box .value {
  font-size: 24px;
  font-weight: 700;
  color: #fff;
}
.controls {
  display: flex;
  gap: 10px;
  margin: 10px 0 14px;
  justify-content: center;
}
.btn {
  background: #6c5ce7;
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 8px 18px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s;
}
.btn:hover { background: #5a4bd6; }
.btn:disabled { opacity: 0.4; cursor: default; }

.grid-container {
  position: relative;
  width: 400px;
  height: 400px;
  background: #1a1a3e;
  border-radius: 12px;
  padding: 10px;
}
.grid-bg {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  width: 100%;
  height: 100%;
}
.cell-bg {
  background: rgba(255,255,255,0.06);
  border-radius: 8px;
}
.tile-layer {
  position: absolute;
  top: 10px; left: 10px; right: 10px; bottom: 10px;
}
.tile {
  position: absolute;
  width: calc((100% - 30px) / 4);
  height: calc((100% - 30px) / 4);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 32px;
  transition: top 0.12s ease, left 0.12s ease;
  z-index: 1;
}
.tile.merged {
  animation: pop 0.2s ease;
  z-index: 2;
}
.tile.new {
  animation: appear 0.2s ease;
}
@keyframes pop {
  0% { transform: scale(1); }
  50% { transform: scale(1.15); }
  100% { transform: scale(1); }
}
@keyframes appear {
  0% { transform: scale(0); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.overlay {
  display: none;
  position: absolute;
  inset: 0;
  background: rgba(10,10,26,0.75);
  border-radius: 12px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 10;
}
.overlay.active { display: flex; }
.overlay h2 { font-size: 36px; margin-bottom: 16px; }
.overlay .btn { margin: 4px; }

.message {
  margin-top: 12px;
  font-size: 13px;
  color: #666;
  text-align: center;
}

@media (max-width: 440px) {
  .grid-container { width: 92vw; height: 92vw; }
  .header h1 { font-size: 36px; }
  .tile { font-size: 22px; }
}
</style>
</head>
<body>

<a class="back-link" href="../index.html">&larr; Back to Launcher</a>

<div class="header">
  <h1>2048</h1>
</div>

<div class="score-bar">
  <div class="score-box"><div class="label">Score</div><div class="value" id="score">0</div></div>
  <div class="score-box"><div class="label">Best</div><div class="value" id="best">0</div></div>
</div>

<div class="controls">
  <button class="btn" id="newGameBtn">New Game</button>
  <button class="btn" id="undoBtn" disabled>Undo</button>
</div>

<div class="grid-container" id="gridContainer">
  <div class="grid-bg">
    <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
    <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
    <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
    <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
  </div>
  <div class="tile-layer" id="tileLayer"></div>
  <div class="overlay" id="overlay">
    <h2 id="overlayTitle"></h2>
    <div>
      <button class="btn" id="overlayNewGame">New Game</button>
      <button class="btn" id="overlayContinue" style="display:none">Keep Playing</button>
    </div>
  </div>
</div>

<div class="message">Use arrow keys, WASD, or swipe to play</div>

<script>
(function() {
  const TILE_COLORS = {
    2:    { bg: '#c8c0f8', fg: '#1a1a3e' },
    4:    { bg: '#d4b896', fg: '#1a1a3e' },
    8:    { bg: '#f2a54a', fg: '#fff' },
    16:   { bg: '#e87d20', fg: '#fff' },
    32:   { bg: '#e85535', fg: '#fff' },
    64:   { bg: '#dc143c', fg: '#fff' },
    128:  { bg: '#e6c84a', fg: '#fff' },
    256:  { bg: '#e6bf20', fg: '#fff' },
    512:  { bg: '#d4a800', fg: '#fff' },
    1024: { bg: '#c89600', fg: '#fff' },
    2048: { bg: '#ffd700', fg: '#1a1a3e' },
  };
  function tileStyle(v) {
    return TILE_COLORS[v] || { bg: '#b89000', fg: '#fff' };
  }

  const SIZE = 4;
  let grid, score, best, prevState, won, keepPlaying, moving;

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const tileLayer = document.getElementById('tileLayer');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayContinue = document.getElementById('overlayContinue');
  const undoBtn = document.getElementById('undoBtn');

  function init() {
    grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
    score = 0;
    prevState = null;
    won = false;
    keepPlaying = false;
    moving = false;
    best = parseInt(localStorage.getItem('2048_best') || '0', 10);
    overlay.classList.remove('active');
    undoBtn.disabled = true;
    addRandom();
    addRandom();
    render();
  }

  function addRandom() {
    const empty = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (grid[r][c] === 0) empty.push([r, c]);
    if (!empty.length) return;
    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
    return [r, c];
  }

  function cloneGrid(g) { return g.map(row => [...row]); }

  function tilePos(r, c) {
    const gap = 10, cellPct = (100 - 3 * gap / 3.8) / 4;
    return {
      left: `calc(${c} * (calc((100% - 30px) / 4) + 10px))`,
      top:  `calc(${r} * (calc((100% - 30px) / 4) + 10px))`
    };
  }

  function render(newTile, mergedSet) {
    tileLayer.innerHTML = '';
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const v = grid[r][c];
        if (v === 0) continue;
        const el = document.createElement('div');
        el.className = 'tile';
        const pos = tilePos(r, c);
        el.style.left = pos.left;
        el.style.top = pos.top;
        const style = tileStyle(v);
        el.style.background = style.bg;
        el.style.color = style.fg;
        if (v >= 1024) el.style.fontSize = '24px';
        else if (v >= 128) el.style.fontSize = '28px';
        el.textContent = v;
        if (newTile && newTile[0] === r && newTile[1] === c) el.classList.add('new');
        if (mergedSet && mergedSet.has(r * SIZE + c)) el.classList.add('merged');
        tileLayer.appendChild(el);
      }
    }
    scoreEl.textContent = score;
    bestEl.textContent = best;
  }

  function slide(row) {
    let arr = row.filter(v => v !== 0);
    const merged = [];
    for (let i = 0; i < arr.length - 1; i++) {
      if (arr[i] === arr[i + 1]) {
        arr[i] *= 2;
        score += arr[i];
        merged.push(i);
        arr[i + 1] = 0;
      }
    }
    arr = arr.filter(v => v !== 0);
    while (arr.length < SIZE) arr.push(0);
    return { result: arr, merged };
  }

  function move(dir) {
    if (moving) return;
    const prev = cloneGrid(grid);
    const prevScore = score;
    const mergedSet = new Set();

    const rotate = (g, times) => {
      let r = g;
      for (let t = 0; t < times; t++) {
        const n = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
        for (let i = 0; i < SIZE; i++)
          for (let j = 0; j < SIZE; j++)
            n[j][SIZE - 1 - i] = r[i][j];
        r = n;
      }
      return r;
    };

    // 0=left,1=up,2=right,3=down
    const rotations = [0, 1, 2, 3];
    const rot = rotations[dir];
    let g = rotate(grid, rot);
    let moved = false;

    for (let r = 0; r < SIZE; r++) {
      const { result, merged } = slide(g[r]);
      if (g[r].some((v, i) => v !== result[i])) moved = true;
      g[r] = result;
      for (const mi of merged) {
        // Convert back to original coordinates
        let rr = r, cc = mi;
        let tr = rr, tc = cc;
        for (let t = 0; t < (4 - rot) % 4; t++) {
          const tmp = tr;
          tr = tc;
          tc = SIZE - 1 - tmp;
        }
        mergedSet.add(tr * SIZE + tc);
      }
    }

    grid = rotate(g, (4 - rot) % 4);

    if (!moved) return;

    prevState = { grid: prev, score: prevScore };
    undoBtn.disabled = false;
    moving = true;

    // Save best
    if (score > best) {
      best = score;
      localStorage.setItem('2048_best', best);
    }

    // First render with positions (triggers CSS transitions for sliding)
    render(null, null);

    setTimeout(() => {
      const nt = addRandom();
      render(nt, mergedSet);
      moving = false;

      // Check win
      if (!won && !keepPlaying) {
        for (let r = 0; r < SIZE; r++)
          for (let c = 0; c < SIZE; c++)
            if (grid[r][c] === 2048) {
              won = true;
              showOverlay('You Win!', true);
              return;
            }
      }

      // Check game over
      if (isGameOver()) {
        showOverlay('Game Over', false);
      }
    }, 130);
  }

  function isGameOver() {
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++) {
        if (grid[r][c] === 0) return false;
        if (c < SIZE - 1 && grid[r][c] === grid[r][c + 1]) return false;
        if (r < SIZE - 1 && grid[r][c] === grid[r + 1][c]) return false;
      }
    return true;
  }

  function showOverlay(title, canContinue) {
    overlayTitle.textContent = title;
    overlayContinue.style.display = canContinue ? 'inline-block' : 'none';
    overlay.classList.add('active');
  }

  function undo() {
    if (!prevState) return;
    grid = prevState.grid;
    score = prevState.score;
    prevState = null;
    undoBtn.disabled = true;
    overlay.classList.remove('active');
    render();
  }

  // Keyboard
  document.addEventListener('keydown', e => {
    const map = {
      ArrowLeft: 0, ArrowUp: 1, ArrowRight: 2, ArrowDown: 3,
      a: 0, w: 1, d: 2, s: 3,
      A: 0, W: 1, D: 2, S: 3
    };
    if (map[e.key] !== undefined) {
      e.preventDefault();
      if (!overlay.classList.contains('active')) move(map[e.key]);
    }
  });

  // Touch / swipe
  let touchStartX, touchStartY;
  const container = document.getElementById('gridContainer');
  container.addEventListener('touchstart', e => {
    const t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
  }, { passive: true });
  container.addEventListener('touchend', e => {
    if (!touchStartX) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    const minSwipe = 30;
    if (Math.abs(dx) < minSwipe && Math.abs(dy) < minSwipe) return;
    if (overlay.classList.contains('active')) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      move(dx > 0 ? 2 : 0);
    } else {
      move(dy > 0 ? 3 : 1);
    }
    touchStartX = null;
  }, { passive: true });

  // Buttons
  document.getElementById('newGameBtn').addEventListener('click', init);
  document.getElementById('overlayNewGame').addEventListener('click', init);
  undoBtn.addEventListener('click', undo);
  overlayContinue.addEventListener('click', () => {
    keepPlaying = true;
    overlay.classList.remove('active');
  });

  init();
})();
</script>
</body>
</html>
