<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Invaders</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    color: #e0e0e0;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }
  #top-bar {
    width: 100%;
    max-width: 800px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
  }
  #top-bar a {
    color: #6c5ce7;
    text-decoration: none;
    font-size: 14px;
  }
  #top-bar a:hover { text-decoration: underline; }
  #hud {
    width: 100%;
    max-width: 800px;
    display: flex;
    justify-content: space-between;
    padding: 5px 20px 10px;
    font-size: 16px;
  }
  #hud span { color: #6c5ce7; }
  canvas {
    border: 1px solid #6c5ce733;
    background: #0a0a1a;
    display: block;
  }
  #overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(10,10,26,0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #overlay.hidden { display: none; }
  #overlay h1 { color: #6c5ce7; font-size: 48px; margin-bottom: 20px; }
  #overlay h2 { color: #6c5ce7; font-size: 32px; margin-bottom: 15px; }
  #overlay p { font-size: 18px; margin: 5px 0; }
  #overlay .start-btn {
    margin-top: 25px;
    padding: 12px 40px;
    background: #6c5ce7;
    color: #fff;
    border: none;
    font-family: 'Courier New', monospace;
    font-size: 18px;
    cursor: pointer;
  }
  #overlay .start-btn:hover { background: #7d6ff0; }
</style>
</head>
<body>
<div id="top-bar">
  <a href="../index.html">&larr; Back to Launcher</a>
  <span style="color:#6c5ce7;font-size:14px;">SPACE INVADERS</span>
</div>
<div id="hud">
  <div>SCORE: <span id="score-display">0</span></div>
  <div>WAVE: <span id="wave-display">1</span></div>
  <div>HIGH: <span id="high-display">0</span></div>
  <div>LIVES: <span id="lives-display">3</span></div>
</div>
<canvas id="game" width="760" height="560"></canvas>
<div id="overlay">
  <h1>SPACE INVADERS</h1>
  <p>Arrow Keys / A,D to move</p>
  <p>Spacebar to shoot</p>
  <button class="start-btn" id="start-btn">START GAME</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('start-btn');
const scoreEl = document.getElementById('score-display');
const waveEl = document.getElementById('wave-display');
const highEl = document.getElementById('high-display');
const livesEl = document.getElementById('lives-display');

let highScore = parseInt(localStorage.getItem('si_high') || '0');
highEl.textContent = highScore;

// Game state
let state = 'menu'; // menu, playing, gameover, waveclear
let score, lives, wave;
let player, bullets, alienBullets, aliens, shields, particles, ufo;
let alienDir, alienDropNext, alienSpeed, alienShootTimer;
let ufoTimer, ufoActive;
let keys = {};
let shootCooldown = 0;
let stateTimer = 0;

document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', e => keys[e.key] = false);
startBtn.addEventListener('click', () => {
  if (state === 'menu' || state === 'gameover') {
    startGame();
  }
});

function startGame() {
  score = 0; lives = 3; wave = 1;
  scoreEl.textContent = 0;
  livesEl.textContent = 3;
  waveEl.textContent = 1;
  overlay.classList.add('hidden');
  initWave();
  state = 'playing';
}

function initWave() {
  player = { x: W / 2, y: H - 40, w: 36, h: 20, speed: 5 };
  bullets = [];
  alienBullets = [];
  particles = [];
  ufo = null;
  ufoTimer = 600 + Math.random() * 600;
  alienDir = 1;
  alienDropNext = false;
  alienSpeed = 0.4 + wave * 0.15;
  alienShootTimer = 60;
  shootCooldown = 0;
  stateTimer = 0;
  waveEl.textContent = wave;

  // Create aliens: 5 rows x 11 cols
  aliens = [];
  const types = [0, 1, 1, 2, 2]; // row type
  const points = [40, 20, 20, 10, 10];
  for (let r = 0; r < 5; r++) {
    for (let c = 0; c < 11; c++) {
      aliens.push({
        x: 80 + c * 52,
        y: 60 + r * 40,
        w: 30, h: 22,
        type: types[r],
        points: points[r],
        alive: true,
        frame: 0
      });
    }
  }

  // Create shields
  shields = [];
  for (let i = 0; i < 4; i++) {
    let sx = 110 + i * 165;
    let sy = H - 110;
    // Each shield is a grid of small blocks
    for (let br = 0; br < 4; br++) {
      for (let bc = 0; bc < 6; bc++) {
        // Skip bottom-center to create arch shape
        if (br >= 2 && bc >= 2 && bc <= 3) continue;
        shields.push({ x: sx + bc * 6, y: sy + br * 6, w: 6, h: 6, hp: 3 });
      }
    }
  }
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 4,
      vy: (Math.random() - 0.5) * 4,
      life: 20 + Math.random() * 20,
      color,
      size: 1 + Math.random() * 2.5
    });
  }
}

function update() {
  if (state !== 'playing') {
    // Handle wave clear / game over delay
    if (state === 'waveclear') {
      stateTimer--;
      if (stateTimer <= 0) {
        wave++;
        initWave();
        state = 'playing';
      }
    }
    updateParticles();
    return;
  }

  // Player movement
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.x -= player.speed;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) player.x += player.speed;
  player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x));

  // Shooting
  if (shootCooldown > 0) shootCooldown--;
  if ((keys[' ']) && shootCooldown <= 0) {
    bullets.push({ x: player.x, y: player.y - player.h / 2, vy: -7, w: 3, h: 10 });
    shootCooldown = 20;
  }

  // Update bullets
  bullets = bullets.filter(b => {
    b.y += b.vy;
    return b.y > -10;
  });
  alienBullets = alienBullets.filter(b => {
    b.y += b.vy;
    return b.y < H + 10;
  });

  // Alien movement
  let liveAliens = aliens.filter(a => a.alive);
  if (liveAliens.length === 0) {
    state = 'waveclear';
    stateTimer = 90;
    return;
  }

  // Dynamic speed: fewer aliens = faster
  let speedMul = 1 + (55 - liveAliens.length) * 0.03;
  let moveX = alienDir * alienSpeed * speedMul;

  if (alienDropNext) {
    liveAliens.forEach(a => a.y += 14);
    alienDir *= -1;
    alienDropNext = false;
    // Check if aliens reached player
    if (liveAliens.some(a => a.y + a.h / 2 >= player.y - player.h / 2)) {
      gameOver();
      return;
    }
  } else {
    let hitEdge = false;
    liveAliens.forEach(a => {
      a.x += moveX;
      if (a.x + a.w / 2 > W - 20 || a.x - a.w / 2 < 20) hitEdge = true;
    });
    if (hitEdge) alienDropNext = true;
  }

  // Animate aliens
  aliens.forEach(a => { if (a.alive) a.frame = (a.frame + 0.03) % 2; });

  // Alien shooting
  alienShootTimer--;
  if (alienShootTimer <= 0) {
    alienShootTimer = Math.max(15, 50 - wave * 3);
    if (liveAliens.length > 0) {
      let shooter = liveAliens[Math.floor(Math.random() * liveAliens.length)];
      alienBullets.push({ x: shooter.x, y: shooter.y + shooter.h / 2, vy: 3 + wave * 0.3, w: 3, h: 10 });
    }
  }

  // UFO
  ufoTimer--;
  if (ufoTimer <= 0 && !ufo) {
    let dir = Math.random() < 0.5 ? 1 : -1;
    ufo = { x: dir === 1 ? -40 : W + 40, y: 30, dir, speed: 2, w: 40, h: 16 };
    ufoTimer = 800 + Math.random() * 800;
  }
  if (ufo) {
    ufo.x += ufo.dir * ufo.speed;
    if (ufo.x < -60 || ufo.x > W + 60) ufo = null;
  }

  // Collision: player bullets vs aliens
  bullets.forEach(b => {
    aliens.forEach(a => {
      if (!a.alive) return;
      if (rectHit(b.x - b.w/2, b.y - b.h/2, b.w, b.h, a.x - a.w/2, a.y - a.h/2, a.w, a.h)) {
        a.alive = false;
        b.y = -999;
        score += a.points;
        scoreEl.textContent = score;
        let colors = ['#ff6b6b','#ffa502','#fff'];
        spawnParticles(a.x, a.y, colors[a.type], 12);
      }
    });
    // Bullet vs UFO
    if (ufo && rectHit(b.x - b.w/2, b.y - b.h/2, b.w, b.h, ufo.x - ufo.w/2, ufo.y - ufo.h/2, ufo.w, ufo.h)) {
      let pts = [50, 100, 150, 300][Math.floor(Math.random() * 4)];
      score += pts;
      scoreEl.textContent = score;
      spawnParticles(ufo.x, ufo.y, '#ff4757', 18);
      ufo = null;
      b.y = -999;
    }
  });
  bullets = bullets.filter(b => b.y > -10);

  // Collision: bullets vs shields
  bullets.forEach(b => {
    shields.forEach(s => {
      if (s.hp <= 0) return;
      if (rectHit(b.x - b.w/2, b.y - b.h/2, b.w, b.h, s.x, s.y, s.w, s.h)) {
        s.hp--;
        b.y = -999;
      }
    });
  });
  alienBullets.forEach(b => {
    shields.forEach(s => {
      if (s.hp <= 0) return;
      if (rectHit(b.x - b.w/2, b.y - b.h/2, b.w, b.h, s.x, s.y, s.w, s.h)) {
        s.hp--;
        b.y = H + 99;
      }
    });
  });

  // Aliens vs shields
  aliens.forEach(a => {
    if (!a.alive) return;
    shields.forEach(s => {
      if (s.hp <= 0) return;
      if (rectHit(a.x - a.w/2, a.y - a.h/2, a.w, a.h, s.x, s.y, s.w, s.h)) {
        s.hp = 0;
      }
    });
  });

  // Collision: alien bullets vs player
  alienBullets.forEach(b => {
    if (rectHit(b.x - b.w/2, b.y - b.h/2, b.w, b.h, player.x - player.w/2, player.y - player.h/2, player.w, player.h)) {
      b.y = H + 99;
      spawnParticles(player.x, player.y, '#6c5ce7', 20);
      lives--;
      livesEl.textContent = lives;
      if (lives <= 0) {
        gameOver();
        return;
      }
    }
  });
  alienBullets = alienBullets.filter(b => b.y < H + 10);

  updateParticles();

  // Check high score
  if (score > highScore) {
    highScore = score;
    highEl.textContent = highScore;
    localStorage.setItem('si_high', highScore);
  }
}

function updateParticles() {
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    p.vy += 0.05;
  });
  particles = particles.filter(p => p.life > 0);
}

function gameOver() {
  state = 'gameover';
  spawnParticles(player.x, player.y, '#6c5ce7', 30);
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('si_high', highScore);
    highEl.textContent = highScore;
  }
  setTimeout(() => {
    overlay.classList.remove('hidden');
    overlay.querySelector('h1').textContent = 'GAME OVER';
    overlay.querySelector('h2')?.remove();
    let info = overlay.querySelectorAll('p');
    info[0].textContent = 'Score: ' + score;
    info[1].textContent = 'Wave: ' + wave;
    startBtn.textContent = 'PLAY AGAIN';
  }, 800);
}

function rectHit(x1, y1, w1, h1, x2, y2, w2, h2) {
  return x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2;
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Stars background
  if (!draw.stars) {
    draw.stars = [];
    for (let i = 0; i < 80; i++) {
      draw.stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.5 + 0.5 });
    }
  }
  ctx.fillStyle = '#ffffff22';
  draw.stars.forEach(s => {
    ctx.fillRect(s.x, s.y, s.s, s.s);
  });

  if (state === 'menu') return;

  // Shields
  shields.forEach(s => {
    if (s.hp <= 0) return;
    let alpha = s.hp / 3;
    ctx.fillStyle = `rgba(108,92,231,${alpha})`;
    ctx.fillRect(s.x, s.y, s.w, s.h);
  });

  // Player
  if (state === 'playing' || state === 'waveclear') {
    ctx.fillStyle = '#6c5ce7';
    // Ship body
    ctx.beginPath();
    ctx.moveTo(player.x, player.y - player.h / 2);
    ctx.lineTo(player.x - player.w / 2, player.y + player.h / 2);
    ctx.lineTo(player.x + player.w / 2, player.y + player.h / 2);
    ctx.closePath();
    ctx.fill();
    // Ship cannon
    ctx.fillRect(player.x - 2, player.y - player.h / 2 - 6, 4, 8);
  }

  // Player bullets
  ctx.fillStyle = '#6c5ce7';
  bullets.forEach(b => {
    ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
  });

  // Alien bullets
  ctx.fillStyle = '#ff6b6b';
  alienBullets.forEach(b => {
    ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
  });

  // Aliens
  aliens.forEach(a => {
    if (!a.alive) return;
    let f = Math.floor(a.frame);
    drawAlien(a.x, a.y, a.type, f);
  });

  // UFO
  if (ufo) {
    ctx.fillStyle = '#ff4757';
    ctx.beginPath();
    ctx.ellipse(ufo.x, ufo.y, ufo.w / 2, ufo.h / 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ff6b81';
    ctx.beginPath();
    ctx.ellipse(ufo.x, ufo.y - 4, 12, 6, 0, Math.PI, Math.PI * 2);
    ctx.fill();
  }

  // Particles
  particles.forEach(p => {
    let a = p.life / 40;
    ctx.globalAlpha = Math.min(1, a);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  });
  ctx.globalAlpha = 1;

  // Wave clear text
  if (state === 'waveclear') {
    ctx.fillStyle = '#6c5ce7';
    ctx.font = '36px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('WAVE ' + wave + ' COMPLETE', W / 2, H / 2);
    ctx.font = '18px Courier New';
    ctx.fillText('Next wave incoming...', W / 2, H / 2 + 35);
    ctx.textAlign = 'left';
  }
}

function drawAlien(x, y, type, frame) {
  ctx.save();
  ctx.translate(x, y);
  if (type === 0) {
    // Top row: small squid-like
    ctx.fillStyle = '#ff6b6b';
    ctx.fillRect(-5, -6, 10, 12);
    ctx.fillRect(-10, -3, 4, 6);
    ctx.fillRect(6, -3, 4, 6);
    if (frame === 0) {
      ctx.fillRect(-12, 4, 4, 4);
      ctx.fillRect(8, 4, 4, 4);
    } else {
      ctx.fillRect(-12, -6, 4, 4);
      ctx.fillRect(8, -6, 4, 4);
    }
    // Eyes
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(-3, -3, 2, 2);
    ctx.fillRect(1, -3, 2, 2);
  } else if (type === 1) {
    // Middle rows: crab-like
    ctx.fillStyle = '#ffa502';
    ctx.fillRect(-8, -6, 16, 12);
    ctx.fillRect(-12, -2, 4, 6);
    ctx.fillRect(8, -2, 4, 6);
    ctx.fillRect(-6, 6, 4, 3);
    ctx.fillRect(2, 6, 4, 3);
    if (frame === 0) {
      ctx.fillRect(-14, 4, 4, 4);
      ctx.fillRect(10, 4, 4, 4);
    } else {
      ctx.fillRect(-14, -4, 4, 4);
      ctx.fillRect(10, -4, 4, 4);
    }
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(-5, -3, 3, 3);
    ctx.fillRect(2, -3, 3, 3);
  } else {
    // Bottom rows: octopus-like
    ctx.fillStyle = '#fff';
    ctx.fillRect(-10, -7, 20, 14);
    ctx.fillRect(-14, -3, 4, 8);
    ctx.fillRect(10, -3, 4, 8);
    if (frame === 0) {
      ctx.fillRect(-10, 7, 4, 4);
      ctx.fillRect(-2, 7, 4, 4);
      ctx.fillRect(6, 7, 4, 4);
    } else {
      ctx.fillRect(-12, 7, 4, 4);
      ctx.fillRect(0, 7, 4, 4);
      ctx.fillRect(8, 7, 4, 4);
    }
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(-6, -3, 4, 4);
    ctx.fillRect(2, -3, 4, 4);
  }
  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
