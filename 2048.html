<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 - Games & AI Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #fff;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .game-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            margin-top: 60px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 20px;
        }

        .score-board {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }

        .score-box {
            background: rgba(102, 126, 234, 0.2);
            border-radius: 10px;
            padding: 15px 25px;
            min-width: 100px;
        }

        .score-label {
            font-size: 0.8em;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
        }

        .score-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #667eea;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(4, 80px);
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 15px;
            margin: 20px auto;
        }

        .cell {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            font-weight: bold;
            transition: all 0.15s ease;
        }

        .cell[data-value="2"] { background: #eee4da; color: #776e65; }
        .cell[data-value="4"] { background: #ede0c8; color: #776e65; }
        .cell[data-value="8"] { background: #f2b179; color: #f9f6f2; }
        .cell[data-value="16"] { background: #f59563; color: #f9f6f2; }
        .cell[data-value="32"] { background: #f67c5f; color: #f9f6f2; }
        .cell[data-value="64"] { background: #f65e3b; color: #f9f6f2; }
        .cell[data-value="128"] { background: #edcf72; color: #f9f6f2; font-size: 1.3em; }
        .cell[data-value="256"] { background: #edcc61; color: #f9f6f2; font-size: 1.3em; }
        .cell[data-value="512"] { background: #edc850; color: #f9f6f2; font-size: 1.3em; }
        .cell[data-value="1024"] { background: #edc53f; color: #f9f6f2; font-size: 1.1em; }
        .cell[data-value="2048"] { background: #edc22e; color: #f9f6f2; font-size: 1.1em; }
        .cell[data-value="4096"] { background: #3c3a32; color: #f9f6f2; font-size: 1.1em; }
        .cell[data-value="8192"] { background: #3c3a32; color: #f9f6f2; font-size: 1.1em; }

        .cell.new {
            animation: pop 0.2s ease;
        }

        .cell.merged {
            animation: merge 0.2s ease;
        }

        @keyframes pop {
            0% { transform: scale(0); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes merge {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .controls {
            margin-top: 20px;
        }

        .controls p {
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 15px;
        }

        .reset-btn {
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 25px;
            color: #fff;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .reset-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .message {
            font-size: 1.3em;
            margin: 15px 0;
            min-height: 30px;
        }

        .message.win {
            color: #edcc61;
        }

        .message.lose {
            color: #f65e3b;
        }

        /* Mobile swipe support message */
        .touch-info {
            display: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9em;
            margin-top: 10px;
        }

        @media (max-width: 500px) {
            .board {
                grid-template-columns: repeat(4, 65px);
            }
            .cell {
                width: 65px;
                height: 65px;
                font-size: 1.2em;
            }
            .cell[data-value="128"],
            .cell[data-value="256"],
            .cell[data-value="512"] {
                font-size: 1.1em;
            }
            .cell[data-value="1024"],
            .cell[data-value="2048"],
            .cell[data-value="4096"],
            .cell[data-value="8192"] {
                font-size: 0.9em;
            }
            .touch-info {
                display: block;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">Back to Hub</a>

    <div class="game-container">
        <h1>2048</h1>
        <p class="subtitle">Join the tiles, get to 2048!</p>

        <div class="score-board">
            <div class="score-box">
                <div class="score-label">Score</div>
                <div class="score-value" id="score">0</div>
            </div>
            <div class="score-box">
                <div class="score-label">Best</div>
                <div class="score-value" id="best">0</div>
            </div>
        </div>

        <div class="board" id="board"></div>

        <div class="message" id="message"></div>

        <div class="controls">
            <p>Use Arrow Keys to move tiles</p>
            <p class="touch-info">Swipe to move on mobile</p>
            <button class="reset-btn" id="resetBtn">New Game</button>
        </div>
    </div>

    <script>
        const boardEl = document.getElementById('board');
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('best');
        const messageEl = document.getElementById('message');
        const resetBtn = document.getElementById('resetBtn');

        let grid = [];
        let score = 0;
        let best = localStorage.getItem('2048best') || 0;
        let gameOver = false;
        let won = false;

        bestEl.textContent = best;

        // Touch support
        let touchStartX, touchStartY;

        function initGame() {
            grid = Array(4).fill().map(() => Array(4).fill(0));
            score = 0;
            gameOver = false;
            won = false;
            scoreEl.textContent = '0';
            messageEl.textContent = '';
            messageEl.className = 'message';

            addRandomTile();
            addRandomTile();
            render();
        }

        function addRandomTile() {
            const empty = [];
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (grid[r][c] === 0) empty.push({ r, c });
                }
            }
            if (empty.length === 0) return false;

            const { r, c } = empty[Math.floor(Math.random() * empty.length)];
            grid[r][c] = Math.random() < 0.9 ? 2 : 4;
            return { r, c };
        }

        function render(newTile = null, mergedTiles = []) {
            boardEl.innerHTML = '';
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const value = grid[r][c];

                    if (value !== 0) {
                        cell.textContent = value;
                        cell.dataset.value = value;

                        if (newTile && newTile.r === r && newTile.c === c) {
                            cell.classList.add('new');
                        }
                        if (mergedTiles.some(t => t.r === r && t.c === c)) {
                            cell.classList.add('merged');
                        }
                    }

                    boardEl.appendChild(cell);
                }
            }
        }

        function slide(row) {
            let arr = row.filter(v => v !== 0);
            const merged = [];

            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i] === arr[i + 1]) {
                    arr[i] *= 2;
                    score += arr[i];
                    arr[i + 1] = 0;
                    merged.push(i);

                    if (arr[i] === 2048 && !won) {
                        won = true;
                        messageEl.textContent = 'You reached 2048!';
                        messageEl.className = 'message win';
                    }
                }
            }

            arr = arr.filter(v => v !== 0);
            while (arr.length < 4) arr.push(0);

            return { arr, merged };
        }

        function move(direction) {
            if (gameOver) return;

            const oldGrid = grid.map(row => [...row]);
            let moved = false;
            const mergedTiles = [];

            if (direction === 'left') {
                for (let r = 0; r < 4; r++) {
                    const { arr, merged } = slide(grid[r]);
                    merged.forEach(c => mergedTiles.push({ r, c }));
                    grid[r] = arr;
                }
            } else if (direction === 'right') {
                for (let r = 0; r < 4; r++) {
                    const { arr, merged } = slide(grid[r].slice().reverse());
                    merged.forEach(c => mergedTiles.push({ r, c: 3 - c }));
                    grid[r] = arr.reverse();
                }
            } else if (direction === 'up') {
                for (let c = 0; c < 4; c++) {
                    const col = [grid[0][c], grid[1][c], grid[2][c], grid[3][c]];
                    const { arr, merged } = slide(col);
                    merged.forEach(r => mergedTiles.push({ r, c }));
                    for (let r = 0; r < 4; r++) grid[r][c] = arr[r];
                }
            } else if (direction === 'down') {
                for (let c = 0; c < 4; c++) {
                    const col = [grid[3][c], grid[2][c], grid[1][c], grid[0][c]];
                    const { arr, merged } = slide(col);
                    merged.forEach(r => mergedTiles.push({ r: 3 - r, c }));
                    for (let r = 0; r < 4; r++) grid[r][c] = arr[3 - r];
                }
            }

            // Check if grid changed
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (oldGrid[r][c] !== grid[r][c]) moved = true;
                }
            }

            if (moved) {
                const newTile = addRandomTile();
                scoreEl.textContent = score;

                if (score > best) {
                    best = score;
                    bestEl.textContent = best;
                    localStorage.setItem('2048best', best);
                }

                render(newTile, mergedTiles);

                if (isGameOver()) {
                    gameOver = true;
                    messageEl.textContent = 'Game Over!';
                    messageEl.className = 'message lose';
                }
            }
        }

        function isGameOver() {
            // Check for empty cells
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (grid[r][c] === 0) return false;
                }
            }

            // Check for possible merges
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    const val = grid[r][c];
                    if (c < 3 && grid[r][c + 1] === val) return false;
                    if (r < 3 && grid[r + 1][c] === val) return false;
                }
            }

            return true;
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault();
                const direction = e.key.replace('Arrow', '').toLowerCase();
                move(direction);
            }
        });

        // Touch controls
        boardEl.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        boardEl.addEventListener('touchend', (e) => {
            if (!touchStartX || !touchStartY) return;

            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;

            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;

            const minSwipe = 50;

            if (Math.abs(dx) > Math.abs(dy)) {
                if (Math.abs(dx) > minSwipe) {
                    move(dx > 0 ? 'right' : 'left');
                }
            } else {
                if (Math.abs(dy) > minSwipe) {
                    move(dy > 0 ? 'down' : 'up');
                }
            }

            touchStartX = null;
            touchStartY = null;
        }, { passive: true });

        resetBtn.addEventListener('click', initGame);

        // Initialize
        initGame();
    </script>
</body>
</html>
